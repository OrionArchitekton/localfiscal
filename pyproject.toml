[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "localfiscal"
version = "0.2.0"
description = "Local-first private receipt + invoice + ledger for solopreneurs and small businesses"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dan Mercede", email = "dan@danmercede.com"}]
dependencies = [
  "typer>=0.9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  "Pillow>=10.0",
  "fpdf2>=2.7",
]

[project.scripts]
localfiscal = "localfiscal.cli:app"
localfiscal-web = "localfiscal.web:run"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10", "ofxparse>=0.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["localfiscal*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # typer/FastAPI use callables in argument defaults by design

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
files = ["localfiscal"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["localfiscal"]
