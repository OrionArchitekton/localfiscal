[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "localfiscal"
version = "0.1.0"
description = "Ambitious local-first private receipt+invoice+ledger for solopreneurs and small businesses"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dan Mercede", email = "dan@danmercede.com"}]
dependencies = [
  "typer>=0.9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  "Pillow>=10.0",
  "fpdf2>=2.7",
]

[project.scripts]
localfiscal = "localfiscal.cli:app"
localfiscal-web = "localfiscal.web:run"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
