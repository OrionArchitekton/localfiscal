name: ci

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy
      - name: Test + coverage
        run: pytest --cov=localfiscal --cov-report=term-missing --cov-fail-under=85
      - name: CLI smoke
        run: python -m localfiscal.cli health
      - name: Isolated installed-package demo
        run: |
          python -m pip install pipx
          python -m pipx run --spec . localfiscal demo --out installed-sample
